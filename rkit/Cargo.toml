[package]
name = "rkit"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
serde = { workspace = true }
serde_json = "1"
raw-window-handle = "0.6"
# Updates come from the project's GitHub releases, also behind a company proxy.
ureq = { version = "3.4.2", features = ["platform-verifier", "win-system-proxy"] }
sha2 = "0.10"
rfd = "0.17"

[build-dependencies]
winresource = "0.1"
resvg = { version = "0.48", default-features = false }
