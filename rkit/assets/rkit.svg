<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2c33"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
    <linearGradient id="caret" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b3ceff"/>
      <stop offset="1" stop-color="#6c9af4"/>
    </linearGradient>
  </defs>
  <!-- ride's tile, so the suite reads as one family. -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#tile)"/>
  <rect x="9" y="9" width="238" height="238" rx="57" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <!-- A kit: four apps, one of them lit in ride's cursor colour. -->
  <rect x="66" y="66" width="54" height="54" rx="15" fill="#f3f4f6"/>
  <rect x="136" y="66" width="54" height="54" rx="15" fill="#f3f4f6" fill-opacity="0.55"/>
  <rect x="66" y="136" width="54" height="54" rx="15" fill="#f3f4f6" fill-opacity="0.55"/>
  <rect x="136" y="136" width="54" height="54" rx="15" fill="url(#caret)"/>
</svg>
