<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2c33"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
    <linearGradient id="caret" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b3ceff"/>
      <stop offset="1" stop-color="#6c9af4"/>
    </linearGradient>
  </defs>
  <!-- The tile, with a faint edge so it holds its shape on dark backgrounds. -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#tile)"/>
  <rect x="9" y="9" width="238" height="238" rx="57" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <!-- A lowercase r: its stem, then its arm. -->
  <path d="M86 188 V110" fill="none" stroke="#f3f4f6" stroke-width="30" stroke-linecap="round"/>
  <path d="M86 134 C86 104 106 86 138 86 H148" fill="none" stroke="#f3f4f6" stroke-width="30" stroke-linecap="round"/>
  <!-- A text cursor after it, as in a terminal. -->
  <rect x="146" y="146" width="36" height="46" rx="10" fill="url(#caret)"/>
</svg>
