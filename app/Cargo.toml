[package]
name = "ride"
version = "0.9.14"
edition.workspace = true
license.workspace = true

[dependencies]
ride-proto = { path = "../proto" }
# The same backend the remote host runs, used in-process for folders on this computer.
ride-agent = { path = "../agent" }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
alacritty_terminal = "0.26"
rfd = "0.17"
tar = { version = "0.4", default-features = false }
flate2 = "1"
serde = { workspace = true }
serde_json = "1"
rodio = "0.23.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
# platform-verifier and win-system-proxy: updates still download behind a company proxy.
ureq = { version = "3.4.2", features = ["platform-verifier", "win-system-proxy"] }
sha2 = "0.10"
# Live sessions: the two copies of ride meet directly, over QUIC.
iroh = "1.3.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
postcard = { workspace = true }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
raw-window-handle = "0.6"
# Reads a picture from the clipboard, for pasting one into a chat.
arboard = "3"
resvg = { version = "0.48", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false }
# Replace in the folder matches what the host's search found, the same way.
regex = "1"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"

[build-dependencies]
winresource = "0.1"
