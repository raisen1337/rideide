[package]
name = "rdrop"
version = "0.5.2"
edition.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
serde = { workspace = true }
serde_json = "1"
raw-window-handle = "0.6"
# Previews: pictures, drawings and sound.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
resvg = { version = "0.48", default-features = false }
rodio = "0.23.0"
# Folders as one tar stream through ssh.
tar = { version = "0.4", default-features = false }
flate2 = "1"
# Checksums: SHA-256 to check copies, MD5 for the blocks of a delta (as perl makes them).
sha2 = "0.10"
md-5 = "0.10"

[build-dependencies]
winresource = "0.1"
resvg = { version = "0.48", default-features = false }
