[package]
name = "rdrop"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
serde = { workspace = true }
serde_json = "1"
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1"
resvg = { version = "0.48", default-features = false }
