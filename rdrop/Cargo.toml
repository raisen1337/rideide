[package]
name = "rdrop"
version = "0.3.0"
edition.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
serde = { workspace = true }
serde_json = "1"
raw-window-handle = "0.6"
# Previews: pictures, drawings and sound.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
resvg = { version = "0.48", default-features = false }
rodio = "0.23.0"

[build-dependencies]
winresource = "0.1"
resvg = { version = "0.48", default-features = false }
