[package]
name = "rterm"
version = "0.5.1"
edition.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
alacritty_terminal = "0.26"
portable-pty = "0.9"
serde = { workspace = true }
serde_json = "1"
raw-window-handle = "0.6"
# Reads the clipboard for a right-click paste.
arboard = "3"

[build-dependencies]
winresource = "0.1"
resvg = { version = "0.48", default-features = false }
